name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main2
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main2

jobs:
  build_and_deploy_job:
    ...
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clean up node_modules and lock file
        run: rm -rf node_modules package-lock.json

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Setup Node.js 20.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Print Node and NPM version
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm install  # or npm ci if you want strict reproducibility

      - name: Build Angular App
        run: npm run build -- --configuration production

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_MUD_068E5B000 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"                
          output_location: "dist/Hero2Hero"
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Azure PR Job
    steps:
      - name: Close Pull Request in Azure SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_MUD_068E5B000 }}
          action: "close"

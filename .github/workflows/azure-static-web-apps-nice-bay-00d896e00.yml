name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main2
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main2

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Workaround:Clean Git Config to Avoid ExtraHeader Error
        run: |
          git config --global --unset-all http.https://github.com/.extraheader || true

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_BAY_00D896E00 }}
          action: "upload"
          app_location: "/"                   # Adjust if your source is in a subfolder
          api_location: ""                    # Optional, only if you use Azure Functions
          output_location: "dist/Hero2Hero"   # Make sure this matches your Angular build_

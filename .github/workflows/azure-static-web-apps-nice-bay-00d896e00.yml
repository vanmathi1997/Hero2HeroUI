name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main2
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main2

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Clean Git Config
        run: |
          git config --global --unset-all http.https://github.com/.extraheader || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Use latest stable version supported by Angular 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular App
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_BAY_00D896E00 }}
          action: "upload"
          app_location: "/" # Adjust if needed
          output_location: "dist/Hero2Hero" # Match the actual Angular build output folder
